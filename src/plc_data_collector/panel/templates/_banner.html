{#- Pending-changes banner; ``pending`` is a PendingChanges or None. -#}
{% if pending %}
<div class="banner{% if pending.css_class %} {{ pending.css_class }}{% endif %}" role="status">
<div class="banner-inner">
<p><strong>{{ pending.headline }}</strong> {{ pending.detail }}</p>
<div class="banner-actions">
<a class="banner-link" href="/panel/changes">Review changes</a>
<form method="post" action="/panel/apply">
<button type="submit" class="btn btn-primary">Apply changes</button>
</form>
</div>
</div>
</div>
{% endif %}
