name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    # PostgreSQL for the tests marked "postgres" (same image tag as docker-compose.yml).
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: plc_data_collector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d plc_data_collector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PLC_DATA_COLLECTOR_TEST_DATABASE_URL: postgresql+pg8000://test:test@127.0.0.1:5432/plc_data_collector_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy

      - name: Verify third-party credits
        run: |
          python tools/generate_credits.py --output "$RUNNER_TEMP/credits.json"
          diff -u src/plc_data_collector/license_data/credits.json "$RUNNER_TEMP/credits.json"

  docker-smoke:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run smoke test
        run: |
          cp .env.example .env
          tools/smoke_test.sh
